name: Deploy

# Repackages Deploy/ (the .catz/.gstz archives plus index.xml and index.bsi that
# BattleScribe downloads) after a data change lands on main, and commits the
# result back.
#
# This runs via workflow_run rather than push so it cannot start unless Validate
# has already passed on the same commit -- a broken catalogue never reaches the
# published index.
#
# Note: workflow_run only fires for the copy of this file on the default branch,
# so changes here cannot be exercised from a pull request. Use the manual
# workflow_dispatch below to smoke-test after merging.

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

# Serialise, so two quick merges cannot race each other's push.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  package:
    name: Repackage Deploy/
    # Only for a *successful* Validate run that came from a push to main.
    # Validate also runs on pull_request; those must not publish anything.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      # Check out main's tip rather than the validated sha: we are committing to
      # main, and if it has moved on, the rebuild is still correct because it is
      # regenerated from whatever the tree holds and re-validated below.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild Deploy/
        run: python .claude/skills/bsdata-cat/scripts/build_deploy.py

      # Full run this time, Deploy/ checks included: every archive must hold the
      # revision its source file claims, and index.xml must agree with both.
      - name: Validate, including Deploy/ consistency
        run: >
          python .claude/skills/bsdata-cat/scripts/validate.py
          --max-warnings 159

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet -- Deploy; then
            echo "Deploy/ already up to date; nothing to commit."
            echo ':white_check_mark: `Deploy/` was already up to date.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Deploy
          git commit -m "rebuild Deploy/ for $(git rev-parse --short HEAD)" \
                     -m 'Generated by .github/workflows/deploy.yml.'

          # A merge landing while we worked would reject the push; rebase onto
          # it and retry. Our only change is Deploy/, which the rebuild is
          # authoritative for, so there is nothing to conflict over.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              git log -1 --format='%h %s' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push rejected, rebasing and retrying ($attempt/3)"
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort
              echo "could not rebase cleanly; giving up" >&2
              exit 1
            }
          done
          echo "push failed after 3 attempts" >&2
          exit 1
